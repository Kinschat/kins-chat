<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff4f9a">
  <meta name="description" content="KINS CHAT — Connect, share and make friends.">
  <title>KINS CHAT - Connect With People</title>

  <link rel="manifest" href="./manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #fff5fa;
      color: #29212a;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 12px #00000008;
    }

    .logo {
      color: #f42f86;
      font-size: 25px;
      font-weight: bold;
    }

    .heart {
      color: #f42f86;
    }

    .hero {
      max-width: 450px;
      margin: 35px auto;
      padding: 20px;
      text-align: center;
    }

    .icon {
      width: 95px;
      height: 95px;
      margin: 10px auto 22px;
      background: #ffe0ef;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 48px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #777;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .card {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px #e94b9412;
      text-align: left;
    }

    .card h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 23px;
    }

    .card p {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #eadde5;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f42f86;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #f42f86;
      color: white;
      font-size: 16px;
      font-weight: bold;
      margin-top: 20px;
      cursor: pointer;
    }

    button:active {
      opacity: 0.85;
    }

    .switch {
      margin-top: 20px;
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
    }

    .switch a {
      color: #f42f86;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      color: #d51d70;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 15px 10px 30px;
    }
  </style>
</head>

<body>
  <header>
    <div class="logo">KINS CHAT <span class="heart">♥</span></div>
    <span>Connect • Share • Smile</span>
  </header>

  <main class="hero">
    <div class="icon">💬</div>

    <h1>Welcome to <span class="heart">KINS CHAT</span></h1>

    <div class="subtitle">
      Your friendly hub for connecting with people.<br>
      Share your thoughts with your community.
    </div>

    <section class="card">
      <h2 id="formTitle">Welcome back!</h2>
      <p id="formSubtitle">Connect with your people.</p>

      <form id="loginForm">
        <div id="nameField" hidden>
          <label for="fullName">Your name</label>
          <input id="fullName" type="text"
                 placeholder="Enter your name"
                 autocomplete="name">
        </div>

        <label for="email">Email address</label>
        <input id="email" type="email"
               placeholder="you@example.com"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input id="password" type="password"
               placeholder="Enter your password"
               autocomplete="current-password"
               minlength="6" required>

        <button type="submit" id="submitButton">
          Log In
        </button>

        <div id="message" role="status"></div>
      </form>

      <div class="switch">
        <span id="switchText">New to KINS CHAT?</span>
        <a id="switchLink" href="#">Create an account</a>
      </div>
    </section>
  </main>

  <footer>
    Made with ♥ for the KINS CHAT community.
  </footer>

 <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  updateProfile
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDkzo2BpL-Wuzh76g0msZNnnHffKYrqmJY",
  authDomain: "kins-chat-app-2026.firebaseapp.com",
  projectId: "kins-chat-app-2026",
  storageBucket: "kins-chat-app-2026.firebasestorage.app",
  messagingSenderId: "195317477859",
  appId: "1:195317477859:web:02a2bc34cf94ebe5a3b0d6",
  measurementId: "G-LXCMD9NNJB"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

let isSignup = false;

const form = document.getElementById("loginForm");
const nameField = document.getElementById("nameField");
const fullName = document.getElementById("fullName");
const email = document.getElementById("email");
const password = document.getElementById("password");
const message = document.getElementById("message");
const submitButton = document.getElementById("submitButton");
const switchLink = document.getElementById("switchLink");

switchLink.onclick = function(event) {
  event.preventDefault();
  isSignup = !isSignup;

  nameField.hidden = !isSignup;
  fullName.required = isSignup;

  document.getElementById("formTitle").textContent =
    isSignup ? "Create your account" : "Welcome back!";

  document.getElementById("formSubtitle").textContent =
    isSignup ? "Join the KINS CHAT community." :
               "Connect with your people.";

  submitButton.textContent = isSignup ? "Sign Up" : "Log In";

  document.getElementById("switchText").textContent =
    isSignup ? "Already have an account?" : "New to KINS CHAT?";

  switchLink.textContent = isSignup ? "Log in" : "Create an account";

  password.autocomplete = isSignup ? "new-password" : "current-password";
  message.textContent = "";
};

form.onsubmit = async function(event) {
  event.preventDefault();

  const emailValue = email.value.trim();
  const passwordValue = password.value;

  message.textContent = "Please wait...";
  submitButton.disabled = true;

  try {
    if (isSignup) {
      const credential = await createUserWithEmailAndPassword(
        auth, emailValue, passwordValue
      );

      const displayName = fullName.value.trim();

      if (displayName) {
        await updateProfile(credential.user, {
          displayName: displayName
        });
      }

      message.textContent = "Account created successfully! Welcome to KINS CHAT.";
    } else {
      await signInWithEmailAndPassword(auth, emailValue, passwordValue);
      message.textContent = "Login successful! Welcome back to KINS CHAT.";
    }
  } catch (error) {
    const errors = {
      "auth/email-already-in-use": "This email already has an account. Please log in.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Your password must be at least 6 characters.",
      "auth/invalid-credential": "Email or password is incorrect.",
      "auth/network-request-failed": "Check your internet connection and try again."
    };

    message.textContent =
      errors[error.code] || "Something went wrong. Please try again.";
  } finally {
    submitButton.disabled = false;
  }
};
</script>
</body>
</html>
